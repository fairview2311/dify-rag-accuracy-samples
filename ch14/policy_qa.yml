app:
  description: 社員の規程の質問に、社内規程と手順書のナレッジから出典付きで答える。答えが無いときは総務部の Teams のチャネルに質問を送る
  icon: 📘
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: 規程の質問に答える
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - name: team_id
    value: チームの ID
    value_type: string
  - name: channel_id
    value: チャネルの ID
    value_type: string
  features:
    file_upload: {}
    opening_statement: 社内規程と手順書をもとに、総務部の担当として答えます。答えが見つからないときは、質問を総務部に送ります。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-kr
      source: start
      sourceHandle: source
      target: kr
      targetHandle: target
    - id: kr-list
      source: kr
      sourceHandle: source
      target: list
      targetHandle: target
    - id: list-llm
      source: list
      sourceHandle: source
      target: llm
      targetHandle: target
    - id: llm-check
      source: llm
      sourceHandle: source
      target: check
      targetHandle: target
    - id: check-docs
      source: check
      sourceHandle: 'true'
      target: docs
      targetHandle: target
    - id: docs-teams
      source: docs
      sourceHandle: source
      target: teams
      targetHandle: target
    - id: teams-escalate
      source: teams
      sourceHandle: source
      target: escalate
      targetHandle: target
    - id: check-answer
      source: check
      sourceHandle: 'false'
      target: answer
      targetHandle: target
    nodes:
    - data:
        desc: ''
        title: 開始
        type: start
        variables: []
      id: start
      position: {x: 30, y: 280}
      type: custom
    - data:
        dataset_ids:
        - ナレッジの ID
        desc: ''
        metadata_filtering_conditions:
          conditions:
          - comparison_operator: is
            name: 状態
            value: 有効
          logical_operator: and
        metadata_filtering_mode: manual
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: jina-reranker-m0
            provider: langgenius/jina/jina
          top_k: 4
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        title: 規程を探す
        type: knowledge-retrieval
      id: kr
      position: {x: 330, y: 280}
      type: custom
    - data:
        desc: ''
        template: '{% for r in docs %}

          ### {{ r.metadata.document_name }}

          出典: {{ r.metadata.doc_metadata["出典"] }}

          {{ r.content }}

          {% endfor %}'
        title: 規程を並べる
        type: template-transform
        variables:
        - value_selector:
          - kr
          - result
          variable: docs
      id: list
      position: {x: 630, y: 280}
      type: custom
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-6.1-terra
          provider: langgenius/openai/openai
        prompt_template:
        - role: system
          text: 'あなたは、みどり文具株式会社の総務部の担当として、社員の質問に答えます。次の「社内規程」に書いてあることだけを使って答えます。


            ## 社内規程

            {{#list.output#}}


            ## 答え方

            - 結論を先に書き、3文以内で答える

            - 最後に「出典」として、根拠にした文書の名前（### の後）と、その文書の「出典:」の URL を書く

            - 文書の名前に部署名（営業部など）が入っている特例は、質問にその部署の名前があるときだけ使う

            - 社内規程に答えが書いていないときは、推測で答えず、「総務部に確認します」とだけ書く'
        title: 答えを作る
        type: llm
        variables: []
        vision:
          enabled: false
      id: llm
      position: {x: 930, y: 280}
      type: custom
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: c1
            value: 総務部に確認します
            varType: string
            variable_selector:
            - llm
            - text
          id: 'true'
          logical_operator: and
        desc: ''
        title: 答えられたか
        type: if-else
      id: check
      position: {x: 1230, y: 280}
      type: custom
    - data:
        desc: ''
        template: '社員から、規程に答えが見つからない質問が届きました。<br>質問: {{ query }}<br>AI
          が探した文書:{% for r in docs %} {{ r.metadata.document_name }}{% if not loop.last %}、{% endif %}{% endfor %}'
        title: 投稿の文を作る
        type: template-transform
        variables:
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - kr
          - result
          variable: docs
      id: docs
      position: {x: 1530, y: 160}
      type: custom
    - data:
        desc: ''
        provider_id: langgenius/teams/teams
        provider_name: langgenius/teams/teams
        provider_type: builtin
        title: Teams に送る
        tool_configurations: {}
        tool_label: チャネルメッセージ送信
        tool_name: send_channel_message
        tool_node_version: '2'
        tool_parameters:
          channel_id:
            type: mixed
            value: '{{#env.channel_id#}}'
          message:
            type: mixed
            value: '{{#docs.output#}}'
          team_id:
            type: mixed
            value: '{{#env.team_id#}}'
        type: tool
      id: teams
      position: {x: 1830, y: 160}
      type: custom
    - data:
        answer: 規程に答えが見つからなかったため、質問を総務部の Teams のチャネルに送りました。担当から返信します。
        desc: ''
        title: 総務部に送ったと伝える
        type: answer
        variables: []
      id: escalate
      position: {x: 2130, y: 160}
      type: custom
    - data:
        answer: '{{#llm.text#}}'
        desc: ''
        title: 答える
        type: answer
        variables: []
      id: answer
      position: {x: 1530, y: 400}
      type: custom
