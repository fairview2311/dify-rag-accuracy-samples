app:
  description: 旧い規程と新しい規程の Word を読み、変わった点のお知らせ（Word）と説明資料（PowerPoint）を作って、関係者へのメールの下書きに添付し、総務部の Teams のチャネルに告知する
  icon: 📣
  icon_background: '#E0F2FE'
  mode: workflow
  name: 規程の改定のお知らせ
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - {name: team_id, value: チームの ID, value_type: string}
  - {name: channel_id, value: チャネルの ID, value_type: string}
  features: {}
  graph:
    edges:
    - {id: e1, source: start, sourceHandle: source, target: read_old, targetHandle: target}
    - {id: e2, source: read_old, sourceHandle: source, target: read_new, targetHandle: target}
    - {id: e3, source: read_new, sourceHandle: source, target: diff, targetHandle: target}
    - {id: e4, source: diff, sourceHandle: source, target: kr, targetHandle: target}
    - {id: e5, source: kr, sourceHandle: source, target: rules, targetHandle: target}
    - {id: e6, source: rules, sourceHandle: source, target: notice, targetHandle: target}
    - {id: e7, source: notice, sourceHandle: source, target: slides, targetHandle: target}
    - {id: e8, source: slides, sourceHandle: source, target: docx, targetHandle: target}
    - {id: e9, source: docx, sourceHandle: source, target: pptx, targetHandle: target}
    - {id: e10, source: pptx, sourceHandle: source, target: draft, targetHandle: target}
    - {id: e11, source: draft, sourceHandle: source, target: att1, targetHandle: target}
    - {id: e12, source: att1, sourceHandle: source, target: att2, targetHandle: target}
    - {id: e13, source: att2, sourceHandle: source, target: tmsg, targetHandle: target}
    - {id: e13b, source: tmsg, sourceHandle: source, target: teams, targetHandle: target}
    - {id: e14, source: teams, sourceHandle: source, target: end, targetHandle: target}
    nodes:
    - data:
        desc: ''
        title: 開始
        type: start
        variables:
        - {allowed_file_extensions: [], allowed_file_types: [document], allowed_file_upload_methods: [local_file], label: 旧い規程の Word, required: true, type: file, variable: old_rule}
        - {allowed_file_extensions: [], allowed_file_types: [document], allowed_file_upload_methods: [local_file], label: 新しい規程の Word, required: true, type: file, variable: new_rule}
        - {label: お知らせを送るメールアドレス, max_length: 200, required: true, type: text-input, variable: to}
      id: start
      position: {x: 30, y: 280}
      type: custom
    - data: {desc: '', is_array_file: false, title: 旧い規程を読む, type: document-extractor, variable_selector: [start, old_rule]}
      id: read_old
      position: {x: 330, y: 280}
      type: custom
    - data: {desc: '', is_array_file: false, title: 新しい規程を読む, type: document-extractor, variable_selector: [start, new_rule]}
      id: read_new
      position: {x: 630, y: 280}
      type: custom
    - data:
        context: {enabled: false, variable_selector: []}
        desc: ''
        model: {completion_params: {temperature: 0}, mode: chat, name: gpt-6.1-terra, provider: langgenius/openai/openai}
        prompt_template:
        - role: system
          text: '旧い規程と新しい規程を見比べ、変わった点だけを箇条書きにします。各行は「第何条：変更前 → 変更後」の形にします。施行日が書いてあれば、最初の行に「施行日：」として書きます。変わっていない条は書きません。'
        - role: user
          text: '## 旧い規程

            {{#read_old.text#}}


            ## 新しい規程

            {{#read_new.text#}}'
        title: 変わった点を出す
        type: llm
        variables: []
        vision: {enabled: false}
      id: diff
      position: {x: 930, y: 280}
      type: custom
    - data:
        dataset_ids:
        - ナレッジの ID
        desc: ''
        metadata_filtering_conditions:
          conditions:
          - {comparison_operator: is, name: 状態, value: 有効}
          logical_operator: and
        metadata_filtering_mode: manual
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model: {model: jina-reranker-m0, provider: langgenius/jina/jina}
          top_k: 4
        query_variable_selector: [diff, text]
        retrieval_mode: multiple
        title: 影響する文書を探す
        type: knowledge-retrieval
      id: kr
      position: {x: 1230, y: 280}
      type: custom
    - data:
        desc: ''
        template: '{% for r in docs %}

          ### {{ r.metadata.document_name }}

          出典: {{ r.metadata.doc_metadata["出典"] }}

          {{ r.content }}

          {% endfor %}'
        title: 文書を並べる
        type: template-transform
        variables:
        - {value_selector: [kr, result], variable: docs}
      id: rules
      position: {x: 1530, y: 280}
      type: custom
    - data:
        context: {enabled: false, variable_selector: []}
        desc: ''
        model: {completion_params: {temperature: 0.2}, mode: chat, name: gpt-6.1-terra, provider: langgenius/openai/openai}
        prompt_template:
        - role: system
          text: 'あなたは、みどり文具株式会社の総務部の担当です。規程の改定を社員に知らせる文書を、Markdown で書きます。


            ## 書き方

            - 1行目は「# 」で始まる題名にする（例「# 経費精算規程の改定のお知らせ」）

            - 「## 変わった点」「## 影響する手続きと手順書」「## お問い合わせ」の3つの見出しを使う

            - 変わった点は、与えられた変更点のとおりに、箇条書きで書く。変更点に無いことは書かない

            - 影響する手続きと手順書には、「関連する文書」のうち、変わった点と関係する手順書の名前を書き、今後どう手続きするかを1文で添える。関係する文書が無ければ「ありません」と書く

            - お問い合わせは「総務部まで」とする'
        - role: user
          text: '## 変わった点

            {{#diff.text#}}


            ## 関連する文書

            {{#rules.output#}}'
        title: お知らせの文を作る
        type: llm
        variables: []
        vision: {enabled: false}
      id: notice
      position: {x: 1830, y: 280}
      type: custom
    - data:
        context: {enabled: false, variable_selector: []}
        desc: ''
        model: {completion_params: {temperature: 0.2}, mode: chat, name: gpt-6.1-terra, provider: langgenius/openai/openai}
        prompt_template:
        - role: system
          text: 'お知らせの文書をもとに、説明会で使うスライドを Markdown で作ります。


            ## 書き方

            - スライドは4枚。1枚ごとに「## 」で始まる見出しを付け、その下に箇条書きを3〜5行書く

            - 1枚目は題名と施行日、2枚目は変わった点、3枚目は手続きで変わること、4枚目は問い合わせ先

            - 1行は30字以内。「# 」の見出しや表は使わない'
        - role: user
          text: '{{#notice.text#}}'
        title: スライドの文を作る
        type: llm
        variables: []
        vision: {enabled: false}
      id: slides
      position: {x: 2130, y: 280}
      type: custom
    - data:
        desc: ''
        provider_id: bowenliang123/md_exporter/md_exporter
        provider_name: bowenliang123/md_exporter/md_exporter
        provider_type: builtin
        title: Word にする
        tool_configurations: {}
        tool_label: md_to_docx
        tool_name: md_to_docx
        tool_node_version: '2'
        tool_parameters:
          md_text: {type: mixed, value: '{{#notice.text#}}'}
          output_filename: {type: mixed, value: 規程の改定のお知らせ}
        type: tool
      id: docx
      position: {x: 2430, y: 280}
      type: custom
    - data:
        desc: ''
        provider_id: bowenliang123/md_exporter/md_exporter
        provider_name: bowenliang123/md_exporter/md_exporter
        provider_type: builtin
        title: PowerPoint にする
        tool_configurations: {}
        tool_label: md_to_pptx
        tool_name: md_to_pptx
        tool_node_version: '2'
        tool_parameters:
          md_text: {type: mixed, value: '{{#slides.text#}}'}
          output_filename: {type: mixed, value: 規程の改定の説明資料}
        type: tool
      id: pptx
      position: {x: 2730, y: 280}
      type: custom
    - data:
        desc: ''
        provider_id: langgenius/outlook/outlook
        provider_name: langgenius/outlook/outlook
        provider_type: builtin
        title: メールの下書きを作る
        tool_configurations: {}
        tool_label: メールの下書き作成
        tool_name: draft_email
        tool_node_version: '2'
        tool_parameters:
          body: {type: mixed, value: "関係者各位\n\n規程を改定しました。変わった点のお知らせ（Word）と、説明資料（PowerPoint）を添付します。\n\n{{#diff.text#}}\n\n総務部"}
          body_type: {type: constant, value: text}
          subject: {type: mixed, value: 【お知らせ】規程の改定について}
          to_recipients: {type: mixed, value: '{{#start.to#}}'}
        type: tool
      id: draft
      position: {x: 3030, y: 280}
      type: custom
    - data:
        desc: ''
        provider_id: langgenius/outlook/outlook
        provider_name: langgenius/outlook/outlook
        provider_type: builtin
        title: お知らせを添付する
        tool_configurations: {}
        tool_label: 下書きに添付ファイルを追加
        tool_name: add_attachment_to_draft
        tool_node_version: '2'
        tool_parameters:
          draft_id: {type: mixed, value: '{{#draft.draft_id#}}'}
          file_to_attach: {type: variable, value: [docx, files]}
        type: tool
      id: att1
      position: {x: 3330, y: 280}
      type: custom
    - data:
        desc: ''
        provider_id: langgenius/outlook/outlook
        provider_name: langgenius/outlook/outlook
        provider_type: builtin
        title: 説明資料を添付する
        tool_configurations: {}
        tool_label: 下書きに添付ファイルを追加
        tool_name: add_attachment_to_draft
        tool_node_version: '2'
        tool_parameters:
          draft_id: {type: mixed, value: '{{#draft.draft_id#}}'}
          file_to_attach: {type: variable, value: [pptx, files]}
        type: tool
      id: att2
      position: {x: 3630, y: 280}
      type: custom
    - data:
        desc: ''
        template: '規程を改定しました。お知らせと説明資料は、メールで関係者に送ります。<br>{{ changes | replace("\n", "<br>") }}'
        title: 告知の文を作る
        type: template-transform
        variables:
        - {value_selector: [diff, text], variable: changes}
      id: tmsg
      position: {x: 3930, y: 120}
      type: custom
    - data:
        desc: ''
        provider_id: langgenius/teams/teams
        provider_name: langgenius/teams/teams
        provider_type: builtin
        title: Teams で告知する
        tool_configurations: {}
        tool_label: チャネルメッセージ送信
        tool_name: send_channel_message
        tool_node_version: '2'
        tool_parameters:
          channel_id: {type: mixed, value: '{{#env.channel_id#}}'}
          message: {type: mixed, value: '{{#tmsg.output#}}'}
          team_id: {type: mixed, value: '{{#env.team_id#}}'}
        type: tool
      id: teams
      position: {x: 3930, y: 280}
      type: custom
    - data:
        desc: ''
        outputs:
        - {value_selector: [diff, text], value_type: string, variable: changes}
        - {value_selector: [docx, files], value_type: 'array[file]', variable: notice_file}
        - {value_selector: [pptx, files], value_type: 'array[file]', variable: slides_file}
        title: 終了
        type: end
      id: end
      position: {x: 4230, y: 280}
      type: custom
